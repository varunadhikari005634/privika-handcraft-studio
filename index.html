<script>
document.addEventListener("DOMContentLoaded", async () => {

    // =====================================================
    // WEBSITE VISITOR TRACKING
    // =====================================================

    if (typeof db === "undefined") {

        console.error("❌ Supabase db not found");

        return;
    }

    try {

        // Get existing visitor ID
        let visitorId =
            localStorage.getItem("privika_visitor_id");


        // Create visitor ID for new visitor
        if (!visitorId) {

            visitorId = crypto.randomUUID();

            localStorage.setItem(
                "privika_visitor_id",
                visitorId
            );

            console.log(
                "🆕 New visitor:",
                visitorId
            );

        } else {

            console.log(
                "👤 Returning visitor:",
                visitorId
            );

        }


        // Record visit in Supabase
        const { error } = await db
            .from("site_visits")
            .insert({
                visitor_id: visitorId
            });


        if (error) {

            console.error(
                "❌ Visit tracking failed:",
                error
            );

            return;
        }


        console.log(
            "✅ Website visit recorded"
        );


    } catch (error) {

        console.error(
            "❌ Visit tracking error:",
            error
        );

    }

});


// =========================================================
// MOBILE CATEGORY DROPDOWN
// =========================================================

document.addEventListener("DOMContentLoaded", function () {

    const categoryBtn =
        document.getElementById("categorySelectorBtn");

    const categoryMenu =
        document.getElementById("categoryMenu");


    if (!categoryBtn || !categoryMenu) {

        console.log(
            "Category selector not found"
        );

        return;
    }


    // Open / close category menu
    categoryBtn.addEventListener(
        "click",
        function (e) {

            e.stopPropagation();

            categoryMenu.classList.toggle("show");

            categoryBtn.classList.toggle("active");

        }
    );


    // Close when clicking outside
    document.addEventListener(
        "click",
        function (e) {

            if (
                !categoryBtn.contains(e.target) &&
                !categoryMenu.contains(e.target)
            ) {

                categoryMenu.classList.remove("show");

                categoryBtn.classList.remove("active");

            }

        }
    );


    // Close after selecting category
    const categoryLinks =
        categoryMenu.querySelectorAll("a");


    categoryLinks.forEach(link => {

        link.addEventListener(
            "click",
            function () {

                categoryMenu.classList.remove("show");

                categoryBtn.classList.remove("active");

            }
        );

    });

});
</script>

</body>
</html>
