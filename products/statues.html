<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Statues</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="../style.css">

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.product-btn {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 1000;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 12px 22px;

    background: rgba(0, 0, 0, 0.92);
    color: #ffd700;

    border: 1px solid rgba(255, 215, 0, 0.65);
    border-radius: 50px;

    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;

    text-decoration: none;

    box-shadow:
        0 0 15px rgba(255, 215, 0, 0.12);

    transition: all 0.3s ease;
}

.product-btn:hover {
    background: #ffd700;
    color: #000;

    transform: translateY(-2px);

    box-shadow:
        0 0 25px rgba(255, 215, 0, 0.4);
}


/* =========================================================
   HEADER
========================================================= */

.product-header {
    width: 100%;
    max-width: 1100px;

    margin: 105px auto 55px;
    padding: 0 25px;

    text-align: center;
}

.product-header h1 {
    margin: 0 0 28px;

    color: #ffd700;

    font-family: 'Cinzel', serif;
    font-size: clamp(2.5rem, 5vw, 4.2rem);
    font-weight: 700;

    line-height: 1.15;
    letter-spacing: 1px;

    text-shadow:
        0 0 18px rgba(255, 215, 0, 0.08);
}

.product-header .desc {
    max-width: 950px;

    margin: 0 auto;

    color: #ddd;

    font-size: 1.05rem;
    font-weight: 400;

    line-height: 1.9;
}


/* =========================================================
   GALLERY
========================================================= */

.gallery-section {
    width: 100%;
    max-width: 1500px;

    margin: 0 auto;

    padding: 0 35px 90px;
}

.gallery-grid {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 30px;

    align-items: stretch;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.gallery-card {
    width: 100%;
    min-width: 0;

    display: flex;
    flex-direction: column;

    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            #171717 0%,
            #090909 100%
        );

    border:
        1px solid rgba(255, 215, 0, 0.28);

    border-radius: 20px;

    text-align: center;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.65);

    transition:
        transform 0.35s ease,
        box-shadow 0.35s ease,
        border-color 0.35s ease;
}

.gallery-card:hover {
    transform: translateY(-8px);

    border-color: #ffd700;

    box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(255, 215, 0, 0.12);
}


/* =========================================================
   IMAGE WRAPPER
========================================================= */

.gallery-card .image-wrapper {
    position: relative;

    width: 100%;
    height: 360px;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #1c1c1c 0%,
            #080808 78%
        );

    border-bottom:
        1px solid rgba(255, 215, 0, 0.14);
}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.gallery-card img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    cursor: zoom-in;

    transition:
        transform 0.5s ease,
        filter 0.4s ease;
}

.gallery-card:hover img {
    transform: scale(1.045);
}


/* =========================================================
   SOLD PRODUCT IMAGE
========================================================= */

.gallery-card .image-wrapper.is-sold img {
    filter:
        grayscale(45%)
        brightness(0.58);

    transform: scale(1);
}

.gallery-card:hover
.image-wrapper.is-sold img {
    transform: scale(1);
}


/* =========================================================
   SOLD OUT OVERLAY
========================================================= */

.sold-overlay {
    position: absolute;

    inset: 0;

    z-index: 20;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(0, 0, 0, 0.25),
            rgba(0, 0, 0, 0.72)
        );

    pointer-events: none;
}


/* =========================================================
   SOLD OUT BADGE
========================================================= */

.sold-badge {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    padding: 14px 32px;

    background:
        rgba(0, 0, 0, 0.94);

    color: #ffd700;

    border:
        2px solid #ffd700;

    border-radius: 8px;

    font-family: 'Cinzel', serif;

    font-size: 18px;
    font-weight: 700;

    letter-spacing: 3px;

    text-transform: uppercase;

    text-shadow:
        0 0 12px rgba(255, 215, 0, 0.45);

    box-shadow:
        0 0 28px rgba(255, 215, 0, 0.28);

    transform: rotate(-4deg);
}


/* =========================================================
   PRODUCT NAME
========================================================= */

.gallery-card h3 {
    width: 100%;

    min-height: 68px;

    margin: 0;

    padding:
        20px 20px 12px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #050505;

    color: #ffd700;

    font-family: 'Cinzel', serif;

    font-size: 20px;
    font-weight: 700;

    line-height: 1.4;

    letter-spacing: 0.7px;

    text-transform: uppercase;
}


/* =========================================================
   PRODUCT INFORMATION
========================================================= */

.product-info {
    margin:
        0 20px 20px;

    padding:
        20px;

    background:
        rgba(255, 255, 255, 0.025);

    border:
        1px solid rgba(255, 215, 0, 0.15);

    border-radius: 13px;

    display: flex;
    flex-direction: column;

    gap: 14px;

    text-align: left;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.product-description {
    padding-bottom: 16px;

    border-bottom:
        1px solid rgba(255, 215, 0, 0.14);
}

.product-description .detail-label {
    display: block;

    margin-bottom: 7px;

    color: #ffd700;

    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1.3px;
}

.product-description p {
    margin: 0;

    color: #d4d4d4;

    font-size: 14px;

    line-height: 1.75;

    overflow-wrap: anywhere;
}


/* =========================================================
   DETAIL ROW
========================================================= */

.product-detail-row {
    display: flex;

    align-items: flex-start;

    gap: 7px;

    padding-bottom: 10px;

    color: #ddd;

    font-size: 14px;

    line-height: 1.55;
}

.product-detail-row:last-child {
    padding-bottom: 0;
}


/* =========================================================
   LABEL
========================================================= */

.detail-label {
    color: #ffd700;

    font-weight: 600;

    white-space: nowrap;
}


/* =========================================================
   VALUE
========================================================= */

.detail-value {
    color: #e0e0e0;

    font-weight: 400;

    overflow-wrap: anywhere;
}


/* =========================================================
   MATERIAL / DIMENSIONS / STOCK
========================================================= */

.product-material,
.product-dimensions,
.product-stock {
    color: #ddd;

    font-size: 14px;

    line-height: 1.6;
}

.product-material strong,
.product-dimensions strong,
.product-stock strong {
    color: #ffd700;
}


/* =========================================================
   PRICE
========================================================= */

.product-price {
    margin:
        0 20px 22px;

    padding:
        13px 18px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 215, 0, 0.08),
            rgba(255, 215, 0, 0.025)
        );

    border:
        1px solid rgba(255, 215, 0, 0.22);

    border-radius: 10px;

    color: #ffd700;

    font-size: 18px;
    font-weight: 600;

    text-align: center;
}


/* =========================================================
   COMING SOON
========================================================= */

.coming-soon {
    position: relative;

    margin:
        0 20px 22px;

    padding:
        20px 18px;

    min-height: 65px;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255, 215, 0, 0.10),
            rgba(255, 215, 0, 0.025)
        );

    border:
        1px solid rgba(255, 215, 0, 0.35);

    border-radius: 12px;

    text-align: center;
}

.coming-soon::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 4px;
    height: 100%;

    background: #ffd700;

    box-shadow:
        0 0 15px rgba(255, 215, 0, 0.7);
}

.coming-soon span {
    color: #ffd700;

    font-family: 'Cinzel', serif;

    font-size: 15px;
    font-weight: 700;

    letter-spacing: 2.5px;

    text-transform: uppercase;

    text-shadow:
        0 0 10px rgba(255, 215, 0, 0.35);
}


/* =========================================================
   NO IMAGE
========================================================= */

.no-image {
    width: 100%;
    height: 360px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #111;

    color: #777;

    font-size: 14px;
}


/* =========================================================
   NO PRODUCTS
========================================================= */

.no-products {
    grid-column: 1 / -1;

    width: 100%;

    padding:
        80px 20px;

    color: #999;

    font-size: 16px;

    text-align: center;
}


/* =========================================================
   IMAGE VIEWER
========================================================= */

.image-viewer {
    position: fixed;

    inset: 0;

    z-index: 99999;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        rgba(0, 0, 0, 0.97);

    backdrop-filter: blur(10px);
}

.viewer-content {
    width: 100%;

    max-width: 1100px;
    max-height: 92vh;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

.viewer-content img {
    max-width: 100%;
    max-height: 80vh;

    width: auto;
    height: auto;

    object-fit: contain;

    border-radius: 12px;

    box-shadow:
        0 0 45px rgba(0, 0, 0, 0.9);
}

.viewer-content h2 {
    margin-top: 17px;

    color: #ffd700;

    font-family: 'Cinzel', serif;

    font-size: 23px;

    letter-spacing: 0.5px;
}


/* =========================================================
   CLOSE VIEWER
========================================================= */

.close-viewer {
    position: absolute;

    top: 20px;
    right: 25px;

    width: 48px;
    height: 48px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;

    background:
        rgba(0, 0, 0, 0.85);

    color: #ffd700;

    border:
        1px solid #ffd700;

    border-radius: 50%;

    font-size: 30px;

    line-height: 1;

    cursor: pointer;

    transition:
        all 0.3s ease;
}

.close-viewer:hover {
    background: #ffd700;

    color: #000;

    transform: scale(1.05);

    box-shadow:
        0 0 20px rgba(255, 215, 0, 0.3);
}


/* =========================================================
   LARGE TABLET
========================================================= */

@media (max-width: 1200px) {

    .gallery-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 25px;
    }

    .gallery-card .image-wrapper,
    .no-image {
        height: 340px;
    }

    .sold-badge {
        padding:
            12px 28px;

        font-size: 16px;
    }
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 800px) {

    .product-header {
        margin-top: 95px;

        padding: 0 20px;
    }

    .product-header h1 {
        font-size: 3rem;
    }

    .product-header .desc {
        font-size: 0.98rem;

        line-height: 1.8;
    }

    .gallery-section {
        padding:
            0 20px 70px;
    }

    .gallery-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 20px;
    }

    .gallery-card .image-wrapper,
    .no-image {
        height: 300px;
    }

    .gallery-card h3 {
        font-size: 16px;
    }

    .product-info {
        margin:
            0 14px 17px;

        padding:
            16px 15px;
    }

    .product-description p {
        font-size: 13px;
    }

    .product-detail-row {
        font-size: 13px;
    }

    .product-price {
        margin:
            0 14px 17px;

        font-size: 16px;
    }

    .coming-soon {
        margin:
            0 14px 17px;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .product-btn {
        top: 12px;
        left: 12px;

        padding:
            9px 16px;

        font-size: 11px;
    }

    .product-header {
        margin-top: 85px;

        margin-bottom: 40px;

        padding:
            0 16px;
    }

    .product-header h1 {
        font-size: 2.3rem;

        margin-bottom: 20px;
    }

    .product-header .desc {
        font-size: 0.92rem;

        line-height: 1.75;
    }

    .gallery-section {
        padding:
            0 14px 55px;
    }

    .gallery-grid {
        grid-template-columns: 1fr;

        gap: 22px;
    }

    .gallery-card {
        border-radius: 18px;
    }

    .gallery-card .image-wrapper,
    .no-image {
        height: 330px;
    }

    .gallery-card h3 {
        min-height: 65px;

        padding:
            18px 15px;

        font-size: 17px;
    }

    .product-info {
        margin:
            0 14px 17px;

        padding:
            16px 15px;

        gap: 12px;
    }

    .product-description {
        padding-bottom: 13px;
    }

    .product-description p {
        font-size: 13px;

        line-height: 1.7;
    }

    .product-detail-row {
        font-size: 13px;

        gap: 6px;
    }

    .product-material,
    .product-dimensions,
    .product-stock {
        font-size: 13px;
    }

    .product-price {
        margin:
            0 14px 17px;

        padding:
            11px 15px;

        font-size: 16px;
    }


    /* SOLD OUT */

    .sold-badge {
        padding:
            11px 22px;

        font-size: 14px;

        letter-spacing: 2px;

        transform:
            rotate(-3deg);
    }


    /* COMING SOON */

    .coming-soon {
        margin:
            0 14px 17px;

        padding:
            18px 12px;

        min-height: 58px;
    }

    .coming-soon span {
        font-size: 13px;

        letter-spacing: 2px;
    }


    /* VIEWER */

    .image-viewer {
        padding:
            15px;
    }

    .viewer-content img {
        max-width: 95vw;

        max-height: 75vh;
    }

    .viewer-content h2 {
        font-size: 17px;
    }

    .close-viewer {
        top: 12px;
        right: 12px;

        width: 42px;
        height: 42px;

        font-size: 27px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    .product-btn {
        padding:
            8px 13px;

        font-size: 10px;
    }

    .product-header {
        padding:
            0 13px;
    }

    .product-header h1 {
        font-size: 1.85rem;
    }

    .product-header .desc {
        font-size: 0.87rem;
    }

    .gallery-section {
        padding:
            0 11px 45px;
    }

    .gallery-card .image-wrapper,
    .no-image {
        height: 285px;
    }

    .gallery-card h3 {
        min-height: 60px;

        padding:
            16px 12px;

        font-size: 15px;
    }

    .product-info {
        margin:
            0 11px 15px;

        padding:
            14px 13px;
    }

    .product-description p {
        font-size: 12px;

        line-height: 1.65;
    }

    .product-detail-row {
        flex-direction: column;

        gap: 2px;

        font-size: 12px;
    }

    .detail-label {
        white-space: normal;
    }

    .product-material,
    .product-dimensions,
    .product-stock {
        font-size: 12px;
    }

    .product-price {
        margin:
            0 11px 15px;

        font-size: 15px;
    }

    .sold-badge {
        padding:
            10px 18px;

        font-size: 12px;

        letter-spacing: 1.5px;
    }

    .coming-soon {
        margin:
            0 11px 15px;

        padding:
            16px 10px;
    }

    .coming-soon span {
        font-size: 12px;

        letter-spacing: 1.5px;
    }
}

</style>
</head>


<body data-category="Naga Statues">

    <!-- BACK BUTTON -->

    <a href="../index.html#products" class="product-btn">
        ← BACK TO PRODUCTS
    </a>


    <!-- HEADER -->

    <section class="product-header">

        <h1>Naga Statues</h1>

        <p class="desc">
            Discover a unique collection of handcrafted statues that blend
            tradition, artistry, and timeless beauty.

            Designed to inspire and elevate any space, each piece reflects
            exceptional craftsmanship and enduring cultural charm.
        </p>

    </section>


    <!-- PRODUCTS FROM SUPABASE -->

    <section class="gallery-section">

        <div id="products-container" class="gallery-grid"></div>

    </section>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../supabase.js"></script>

    <script src="load-products.js"></script>

</body>

</html>
