
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Decor | Privika Handicraft Studio</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="../style.css">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #000;
    color: #fff;
    font-family: 'Poppins', sans-serif;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.product-btn {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 1000;

    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding: 11px 21px;

    background: rgba(0, 0, 0, 0.92);
    color: #ffd700;

    border: 1px solid rgba(255, 215, 0, 0.45);
    border-radius: 30px;

    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;

    text-decoration: none;

    transition: all 0.3s ease;
}

.product-btn:hover {
    background: #ffd700;
    color: #000;

    border-color: #ffd700;

    transform: translateY(-2px);

    box-shadow:
        0 8px 25px rgba(255, 215, 0, 0.25);
}


/* =========================================================
   HEADER
========================================================= */

.product-header {
    width: 100%;
    max-width: 1100px;

    margin: 105px auto 55px;

    padding: 0 25px;

    text-align: center;
}

.product-header h1 {
    font-family: 'Cinzel', serif;

    font-size: clamp(2.4rem, 5vw, 4rem);

    line-height: 1.2;

    color: #ffd700;

    margin-bottom: 25px;
}

.product-header .desc {
    max-width: 900px;

    margin: auto;

    color: #d0d0d0;

    font-size: 1rem;

    line-height: 1.85;
}


/* =========================================================
   GALLERY
========================================================= */

.gallery-section {
    width: 100%;
    max-width: 1500px;

    margin: auto;

    padding: 0 40px 90px;
}

.gallery-grid {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 32px;

    align-items: start;
}


/* =========================================================
   PREMIUM PRODUCT CARD
========================================================= */

.gallery-card {

    width: 100%;
    min-width: 0;

    background:
        linear-gradient(
            180deg,
            #141414 0%,
            #090909 100%
        );

    border:
        1px solid rgba(255, 215, 0, 0.28);

    border-radius: 20px;

    overflow: hidden;

    display: flex;
    flex-direction: column;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.65);

    transition:
        transform 0.35s ease,
        box-shadow 0.35s ease,
        border-color 0.35s ease;
}

.gallery-card:hover {

    transform: translateY(-8px);

    border-color: #ffd700;

    box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(255, 215, 0, 0.12);
}

/* =========================================================
   SOLD OUT OVERLAY
========================================================= */

.gallery-card .image-wrapper {
    position: relative;
}

/* Dark overlay over product image */
.gallery-card .sold-overlay {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(0, 0, 0, 0.35),
            rgba(0, 0, 0, 0.72)
        );

    z-index: 5;

    pointer-events: none;
}

/* SOLD OUT badge */
.gallery-card .sold-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 13px 30px;

    border: 2px solid #ffd700;
    border-radius: 8px;

    background: rgba(0, 0, 0, 0.88);

    color: #ffd700;

    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 700;

    letter-spacing: 2px;

    text-shadow:
        0 0 10px rgba(255, 215, 0, 0.5);

    box-shadow:
        0 0 25px rgba(255, 215, 0, 0.25);

    transform: rotate(-4deg);
}

/* Sold image slightly faded */
.gallery-card .image-wrapper.is-sold img {
    filter: grayscale(35%) brightness(0.65);

    transform: scale(1);
}

/* Don't zoom sold product */
.gallery-card:hover .image-wrapper.is-sold img {
    transform: scale(1);
}


/* =========================================================
   COMING SOON
========================================================= */

.gallery-card .coming-soon {

    margin: 10px 20px 22px;

    padding: 18px 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(255, 215, 0, 0.07),
            rgba(255, 215, 0, 0.02)
        );

    border:
        1px solid rgba(255, 215, 0, 0.3);

    border-radius: 12px;

    text-align: center;
}

.gallery-card .coming-soon span {

    color: #ffd700;

    font-family: 'Cinzel', serif;

    font-size: 15px;

    font-weight: 700;

    letter-spacing: 2px;

    text-shadow:
        0 0 10px rgba(255, 215, 0, 0.35);
}


/* =========================================================
   SOLD CARD
========================================================= */

.gallery-card:has(.sold-overlay) {

    border-color:
        rgba(255, 215, 0, 0.38);
}

.gallery-card:has(.sold-overlay) h3 {

    opacity: 0.9;
}


/* =========================================================
   IMAGE
========================================================= */

.gallery-card .image-wrapper {

    width: 100%;

    height: 360px;

    background:
        radial-gradient(
            circle at center,
            #1a1a1a 0%,
            #080808 75%
        );

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-bottom:
        1px solid rgba(255, 215, 0, 0.14);
}

.gallery-card img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    transition:
        transform 0.5s ease;
}

.gallery-card:hover img {
    transform: scale(1.045);
}


/* =========================================================
   PRODUCT NAME
========================================================= */

.gallery-card h3 {

    width: 100%;

    padding:
        22px 22px 8px;

    background: transparent;

    color: #ffd700;

    font-family: 'Cinzel', serif;

    font-size: 20px;

    font-weight: 700;

    line-height: 1.4;

    letter-spacing: 0.6px;

    text-align: center;
}


/* =========================================================
   PRODUCT INFORMATION BOX
========================================================= */

.product-info {

    margin: 10px 20px 22px;

    padding: 18px 20px;

    background:
        rgba(255, 255, 255, 0.025);

    border:
        1px solid rgba(255, 215, 0, 0.15);

    border-radius: 12px;

    display: flex;

    flex-direction: column;

    gap: 14px;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.product-description {

    padding-bottom: 14px;

    border-bottom:
        1px solid rgba(255, 215, 0, 0.12);
}

.product-description .detail-label {

    display: block;

    margin-bottom: 6px;

    color: #ffd700;

    font-size: 11px;

    font-weight: 600;

    text-transform: uppercase;

    letter-spacing: 1.2px;
}

.product-description p {

    margin: 0;

    color: #d2d2d2;

    font-size: 14px;

    line-height: 1.7;

    text-align: left;

    overflow-wrap: anywhere;
}


/* =========================================================
   DETAIL ROWS
========================================================= */

.product-detail-row {

    display: flex;

    align-items: flex-start;

    gap: 8px;

    font-size: 14px;

    line-height: 1.5;
}

.detail-label {

    color: #ffd700;

    font-weight: 600;

    white-space: nowrap;
}

.detail-value {

    color: #d2d2d2;

    font-weight: 400;

    overflow-wrap: anywhere;
}


/* =========================================================
   PRICE
========================================================= */

.product-price {

    margin:
        0 20px 22px;

    padding:
        12px 16px;

    background:
        rgba(255, 215, 0, 0.06);

    border:
        1px solid rgba(255, 215, 0, 0.18);

    border-radius: 10px;

    color: #ffd700;

    font-size: 17px;

    font-weight: 600;

    text-align: center;
}


/* =========================================================
   NO IMAGE
========================================================= */

.no-image {

    width: 100%;
    height: 360px;

    background: #111;

    color: #777;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 14px;
}


/* =========================================================
   NO PRODUCTS
========================================================= */

.no-products {

    grid-column: 1 / -1;

    width: 100%;

    padding: 70px 20px;

    color: #999;

    font-size: 16px;

    text-align: center;
}


/* =========================================================
   IMAGE VIEWER
========================================================= */

.image-viewer {

    position: fixed;

    inset: 0;

    z-index: 99999;

    background:
        rgba(0, 0, 0, 0.96);

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 25px;

    backdrop-filter: blur(10px);
}

.viewer-content {

    width: 100%;
    max-width: 1100px;

    max-height: 92vh;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

.viewer-content img {

    max-width: 100%;
    max-height: 80vh;

    width: auto;
    height: auto;

    object-fit: contain;

    border-radius: 12px;

    box-shadow:
        0 0 45px rgba(0, 0, 0, 0.9);
}

.viewer-content h2 {

    color: #ffd700;

    font-family: 'Cinzel', serif;

    font-size: 23px;

    margin-top: 17px;
}

.close-viewer {

    position: absolute;

    top: 20px;
    right: 25px;

    width: 48px;
    height: 48px;

    padding: 0;

    border-radius: 50%;

    border:
        1px solid #ffd700;

    background:
        rgba(0, 0, 0, 0.85);

    color: #ffd700;

    font-size: 30px;

    cursor: pointer;

    transition: 0.3s ease;
}

.close-viewer:hover {

    background: #ffd700;

    color: #000;

    transform: none;
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 1100px) {

    .gallery-grid {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 25px;
    }

    .gallery-card .image-wrapper,
    .no-image {

        height: 330px;
    }
}


/* =========================================================
   SMALL TABLET
========================================================= */

@media (max-width: 750px) {

    .gallery-section {

        padding:
            0 20px 60px;
    }

    .gallery-grid {

        grid-template-columns: 1fr;

        max-width: 600px;

        margin: auto;
    }

    .gallery-card .image-wrapper,
    .no-image {

        height: 380px;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 550px) {

    .product-btn {

        top: 12px;
        left: 12px;

        padding:
            9px 15px;

        font-size: 11px;
    }

    .product-header {

        margin-top: 82px;

        margin-bottom: 40px;

        padding:
            0 16px;
    }

    .product-header h1 {

        font-size: 2.15rem;

        margin-bottom: 18px;
    }

    .product-header .desc {

        font-size: 0.9rem;

        line-height: 1.75;
    }

    .gallery-section {

        padding:
            0 14px 50px;
    }

    .gallery-grid {

        grid-template-columns: 1fr;

        gap: 22px;
    }

    .gallery-card {

        border-radius: 17px;
    }

    .gallery-card .image-wrapper,
    .no-image {

        height: 330px;
    }

    .gallery-card h3 {

        font-size: 18px;

        padding:
            20px 16px 8px;
    }

    .product-info {

        margin:
            8px 14px 17px;

        padding:
            15px 15px;

        gap: 12px;
    }

    .product-description p {

        font-size: 13px;

        line-height: 1.65;
    }

    .product-detail-row {

        font-size: 13px;

        gap: 6px;
    }

    .product-price {

        margin:
            0 14px 17px;

        font-size: 15px;
    }

    .viewer-content img {

        max-width: 95vw;

        max-height: 75vh;
    }

    .viewer-content h2 {

        font-size: 17px;
    }

    .close-viewer {

        top: 12px;
        right: 12px;

        width: 42px;
        height: 42px;

        font-size: 27px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    .product-header h1 {

        font-size: 1.85rem;
    }

    .gallery-card .image-wrapper,
    .no-image {

        height: 285px;
    }

    .product-info {

        margin:
            7px 11px 15px;

        padding:
            13px;
    }

    .product-detail-row {

        flex-direction: column;

        gap: 2px;
    }

}

</style>

</head>


<body data-category="Home Decor">


    <!-- BACK BUTTON -->

    <a href="../index.html#products" class="product-btn">
        ← Back to Products
    </a>


    <!-- HEADER -->

    <section class="product-header">

        <h1>Home Decor</h1>

        <p class="desc">
            Explore our handcrafted home décor collection, thoughtfully
            designed to bring warmth, character, and artistic charm to
            your interiors.

            Each piece combines traditional craftsmanship with timeless
            design, creating distinctive accents for modern and
            contemporary spaces.
        </p>

    </section>


    <!-- PRODUCTS FROM SUPABASE -->

    <section class="gallery-section">

        <div
            id="products-container"
            class="gallery-grid">
        </div>

    </section>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your Supabase configuration -->
    <script src="../supabase.js"></script>

    <!-- Product loader -->
    <script src="load-products.js"></script>


</body>

</html>
